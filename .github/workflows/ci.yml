name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend (install + test)
        working-directory: src/backend
        run: |
          npm ci
          npm test

      - name: Frontend (syntax check)
        run: |
          node --check src/frontend/content.js
          node --check src/frontend/background.js
          node --check src/frontend/popup.js

      - name: Manifest (JSON parse)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('src/frontend/manifest.json','utf8')); console.log('manifest.json ok')"

