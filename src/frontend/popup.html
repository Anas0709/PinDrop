<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-align: center;
    }
    .status.active {
      background-color: #e8f5e8;
      color: #2d5a2d;
      border: 1px solid #4caf50;
    }
    .status.inactive {
      background-color: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
    }
    .instructions {
      font-size: 14px;
      line-height: 1.4;
      color: #555;
    }
    .hotkey {
      background-color: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Micro-Pin Answerer</h2>
  </div>
  
  <div id="status" class="status inactive">
    Extension Ready
  </div>
  
  <div style="text-align: center; margin-bottom: 15px;">
    <button id="activateBtn" style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px;">
      Activate Extension
    </button>
  </div>
  
  <div class="instructions">
    <p><strong>How to use:</strong></p>
    <ol>
      <li>Highlight a question with answer choices</li>
      <li>Press <span class="hotkey">Cmd+Shift+P</span> (Mac) or <span class="hotkey">Ctrl+Shift+P</span> (Windows/Linux)</li>
      <li>Click pins to verify answers</li>
    </ol>
    
    <p><strong>Supported formats:</strong></p>
    <ul>
      <li>A) B) C) D)</li>
      <li>1. 2. 3. 4.</li>
      <li>• Bullet points</li>
    </ul>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
